<!DOCTYPE html>
<html>

<head>
    <title>Mini CRM</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            text-align:center;
        }

        .box{
            width:400px;
            margin:auto;
            background:white;
            padding:20px;
            margin-top:20px;
            border-radius:10px;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:8px 15px;
            margin:3px;
            cursor:pointer;
        }

        table{
            width:90%;
            margin:auto;
            background:white;
        }
    </style>
</head>

<body>

<h2>Mini CRM 🚀</h2>

<!-- LOGIN -->
<div class="box">
    <h3>Admin Login</h3>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<!-- CRM -->
<div class="container" style="display:none;">

    <div class="box">
        <h3>Add Lead</h3>

        <form id="leadForm">
            <input id="name" placeholder="Name" required>
            <input id="email" placeholder="Email" required>
            <button>Add Lead</button>
        </form>
    </div>

    <h3>Leads</h3>

    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Notes</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="leadTableBody"></tbody>
    </table>

</div>

<script src="script.js"></script>

</body>

</html>
